# Fly.io deployment for the API and the realtime poller.
#
#   fly launch --no-deploy          # once, to create the app
#   fly secrets set DATABASE_URL=... REDIS_URL=... CORS_ORIGINS=https://your-frontend
#   fly deploy
#
# The database and Redis are somebody else's free tier (Neon and Upstash);
# nothing here provisions them, and nothing here costs money on the free plan.

app = "a2transit"
primary_region = "ord"          # Chicago: nearest region to Ann Arbor.

[build]
  dockerfile = "backend/Dockerfile"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "INFO"
  # Deliberately absent: REALTIME_INLINE_POLL. Fly has a worker tier and the
  # [processes] block below runs the poller as its own process, which is the
  # right shape — six feeds fetched once, by one consumer, whatever the API is
  # doing. Setting it here as well would poll twice. render.yaml turns it on
  # because Render's free plan has no worker to run.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  # Scaled to zero when idle, which is what keeps a hobby deployment free. The
  # first request after a suspend pays the timetable build (~350 ms) on top of
  # the wake, so the readiness check below is what stops a load balancer
  # sending traffic before that has happened.
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/ready"

[[vm]]
  # 512 MB rather than 256. Measured: 68 MB idle, +54 MB for the first RAPTOR
  # timetable, +31 MB per further service date, and the same again for the
  # Dijkstra reference that `?engine=dijkstra` exposes. The default cache of 4
  # dates per engine is comfortable here; set TIMETABLE_CACHE_SIZE lower on a
  # smaller machine.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# The poller is a second process in the same app rather than a second app, so
# it shares the Redis connection string and the deploy.
[processes]
  api = "uvicorn a2transit.main:app --host 0.0.0.0 --port 8000"
  poller = "python -m a2transit.realtime"
