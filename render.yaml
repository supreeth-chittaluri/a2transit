# Render Blueprint — the free-tier deployment.
#
#   Render dashboard → New → Blueprint → point it at this repository.
#
# Everything here fits on plans that need no credit card. The database and
# Redis are deliberately *not* declared: Render's own free Postgres expires
# after 30 days, which is no good for a link on a CV, and its free plan has no
# Redis at all. Both come from elsewhere and arrive as environment variables:
#
#   DATABASE_URL   Neon    (free, no card, no expiry, PostGIS available)
#   REDIS_URL      Upstash (free, no card)
#
# fly.toml is the same deployment for a host that has a worker tier. The two
# differ in exactly one respect, and it is the interesting one — see below.

services:
  - type: web
    name: a2transit-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: ohio            # Nearest to Ann Arbor and to Neon's us-east-2.
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production

      # The free plan has no worker, so the API polls the agency feeds itself.
      # Safe here only because the image runs a single uvicorn worker: one
      # poller per process is still one poller. Enabling this alongside a real
      # worker, or with multiple uvicorn workers, means polling somebody else's
      # unauthenticated endpoint several times over — see
      # a2transit/realtime/inline.py, and note that fly.toml leaves it off
      # because Fly runs the poller as its own process.
      - key: REALTIME_INLINE_POLL
        value: "true"

      # 512 MB on the free plan. Measured: 68 MB idle, +54 MB for the first
      # RAPTOR timetable, +31 MB per extra date — then the same again for the
      # Dijkstra reference, which `?engine=dijkstra` makes publicly reachable,
      # and again for each live-adjusted overlay. Four dates per engine fits a
      # real machine and does not fit this one.
      - key: TIMETABLE_CACHE_SIZE
        value: "2"

      # Credentials, set in the dashboard rather than committed.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

# The frontend is not here on purpose. It is a static bundle and goes to Vercel,
# which serves it from a CDN rather than from one machine in Ohio, and a
# Blueprint applies every service in this file — so declaring it here too would
# quietly stand up a second, slower copy of the same site.
#
# To keep everything on Render instead, add back:
#
#   - type: web
#     name: a2transit-web
#     runtime: static
#     buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
